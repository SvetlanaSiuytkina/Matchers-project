name: Lint and Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eslint:
    runs-on: ubuntu-latest
    
    steps:
     - uses: actions/checkout@v4
     - uses: actions/setup-node@v4
       with:
         node-version: 22.14.0
         cache: 'npm'
     - run: npm
     - run: npm lint
     
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
      node-version: 22.14.0
      cache: 'npm'
    - run: npm
    - run: npm test -- --coverage